name: Keep Supabase awake

# Supabase free-tier projects pause after ~7 days without activity. This job
# runs a tiny anon-read query against the public-read `cards` table to keep the
# project live.
#
# It talks to Supabase DIRECTLY (not through the Vercel app), so it still works
# when no deploy is running — a Vercel-independent backup for the daily Vercel
# Cron in vercel.json. The anon key is public by design (it ships in the browser
# bundle), but it's kept in repo secrets so it isn't committed here.
#
# Setup — add two repo secrets (Settings → Secrets and variables → Actions),
# the same values as NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY:
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key

on:
  schedule:
    # 07:00 UTC every 2 days. Well inside the 7-day pause window even if GitHub
    # delays or skips a run — scheduled workflows are best-effort, not exact.
    - cron: "0 7 */2 * *"
  # Lets you trigger it by hand from the Actions tab (e.g. right after un-pausing).
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from cards (anon)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repo secrets."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/cards?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Expected HTTP 200, got $status"
            exit 1
          fi
